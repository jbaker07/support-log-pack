name: tests

on:
  push:
  pull_request:

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        #both runner images ship with pwsh, so the PowerShell checks run on both
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: ./tests/run_tests.sh

  windows:
    #runs collect-logs.ps1 for real, under Windows PowerShell 5.1 and under PowerShell 7
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect, unpack and check the bundle
        shell: pwsh
        run: pwsh -NoProfile -File tests/windows_bundle_test.ps1 -Engine ${{ matrix.engine }}
